[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthgate"
version = "0.1.0"
description = "Declarative, registry-driven health-check engine that gates project phases on checks resolving to PASS/SKIPPED."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "sephnaoe" }]
keywords = ["health-check", "ci", "deployment-gate", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.scripts]
healthgate = "healthgate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["healthgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
